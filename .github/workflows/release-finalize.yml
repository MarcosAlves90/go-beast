name: Release Finalize

on:
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to finalize
        required: true
        type: string

jobs:
  finalize-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name='${{ inputs.tag_name }}'
          else
            tag_name='${{ github.event.release.tag_name }}'
          fi

          if [ -z "$tag_name" ]; then
            echo "Missing release tag" >&2
            exit 1
          fi

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag_name }}
          fetch-depth: 0

      - name: Verify release certificate state
        run: node scripts/release-version.mjs check

      - name: Confirm draft release
        run: |
          is_draft="$(gh release view "${{ steps.meta.outputs.tag_name }}" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" != "true" ]; then
            echo "Release must still be a draft before finalization" >&2
            exit 1
          fi

      - name: Generate GitHub attestation
        uses: actions/attest@v4
        with:
          subject-path: release-certificate.json

      - name: Download attestation bundle
        run: |
          gh attestation download release-certificate.json -R "${{ github.repository }}"
          bundle_path="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -print -quit)"
          mv "$bundle_path" release-certificate.sigstore.json

      - name: Upload attestation bundle asset
        run: |
          gh release upload "${{ steps.meta.outputs.tag_name }}" release-certificate.sigstore.json --clobber

      - name: Publish release
        run: |
          gh release edit "${{ steps.meta.outputs.tag_name }}" --draft=false
