name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override (x.y.z)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: release/next
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate release surfaces
        id: generate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            npm run release:prepare -- --version "$RELEASE_VERSION" > release-summary.json
          else
            npm run release:prepare > release-summary.json
          fi
          next_version="$(node -p "JSON.parse(require('fs').readFileSync('release-summary.json', 'utf8')).nextVersion")"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          rm release-summary.json

      - name: Create or update release branch
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$RELEASE_BRANCH"
          git add CHANGELOG.md package.json README.md PACKAGE.md plugins/go-beast/.codex-plugin/plugin.json plugins/go-beast/.claude-plugin/plugin.json release-certificate.json
          git commit -m "chore(release): prepare release" || {
            echo "No release changes were generated" >&2
            exit 1
          }
          git push --force origin "HEAD:$RELEASE_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        env:
          RELEASE_COMMIT: ${{ steps.branch.outputs.commit }}
          RELEASE_VERSION: ${{ steps.generate.outputs.next_version }}
        run: |
          pr_number="$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number')"
          body="This PR was generated by the manual release-preparation workflow for v$RELEASE_VERSION. Review the calculated version and \`CHANGELOG.md\` before merging. After merge, publish with the existing \`npm run release:version:publish\` flow."
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "[release] Prepare v$RELEASE_VERSION" --body "$body"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "[release] Prepare v$RELEASE_VERSION" --body "$body"
          fi
