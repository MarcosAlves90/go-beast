name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override (x.y.z)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      next_version: ${{ steps.generate.outputs.next_version }}
    steps:
      - name: Require the release ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/release" ]; then
            echo "Prepare Release must be dispatched against refs/heads/release; received $GITHUB_REF." >&2
            exit 1
          fi

      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1

      - name: Generate release surfaces
        id: generate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            node scripts/prepare-release.mjs --version "$RELEASE_VERSION" > release-summary.json
          else
            node scripts/prepare-release.mjs > release-summary.json
          fi
          next_version="$(node -p "JSON.parse(require('fs').readFileSync('release-summary.json', 'utf8')).nextVersion")"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          rm release-summary.json

      - name: Build safe filesystem bundle
        run: node scripts/safe-fs/build.mjs

      - name: Validate generated release surfaces
        run: |
          npm run release:version:check
          npm run verify

      - name: Package generated release surfaces
        run: |
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/release-surfaces.tar.gz" \
            CHANGELOG.md package.json README.md PACKAGE.md \
            plugins/go-beast/.codex-plugin/plugin.json \
            plugins/go-beast/.claude-plugin/plugin.json \
            release-certificate.json scripts/safe-fs/bin/

      - name: Upload generated release surfaces
        uses: actions/upload-artifact@v4
        with:
          name: release-surfaces
          path: ${{ runner.temp }}/release-surfaces.tar.gz
          if-no-files-found: error
          retention-days: 1

  write:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_BRANCH: release
      PREPARE_BRANCH: chore/release-prepare
      RELEASE_VERSION: ${{ needs.generate.outputs.next_version }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated release surfaces
        uses: actions/download-artifact@v4
        with:
          name: release-surfaces
          path: ${{ runner.temp }}/release-surfaces

      - name: Validate and extract release surfaces
        run: |
          archive="$RUNNER_TEMP/release-surfaces/release-surfaces.tar.gz"
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          allowed_files = {
              "CHANGELOG.md",
              "package.json",
              "README.md",
              "PACKAGE.md",
              "plugins/go-beast/.codex-plugin/plugin.json",
              "plugins/go-beast/.claude-plugin/plugin.json",
              "release-certificate.json",
          }
          allowed_dirs = {
              "plugins",
              "plugins/go-beast",
              "plugins/go-beast/.codex-plugin",
              "plugins/go-beast/.claude-plugin",
              "scripts",
              "scripts/safe-fs",
              "scripts/safe-fs/bin",
          }
          with tarfile.open(sys.argv[1], "r:gz") as archive_file:
              members = archive_file.getmembers()
              if not members:
                  raise SystemExit("Release-surface artifact is empty.")
              for member in members:
                  raw_parts = member.name.split("/")
                  path = pathlib.PurePosixPath(member.name)
                  normalized = path.as_posix()
                  if member.name.startswith("/") or any(part in ("..", ".") for part in raw_parts):
                      raise SystemExit(f"Unsafe release-surface path: {member.name}")
                  is_bundle_file = normalized.startswith("scripts/safe-fs/bin/") and member.isfile()
                  if normalized not in allowed_files and normalized not in allowed_dirs and not is_bundle_file:
                      raise SystemExit(f"Unexpected release-surface path: {member.name}")
                  if not member.isfile() and not member.isdir():
                      raise SystemExit(f"Unsupported release-surface entry type: {member.name}")
          PY
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$GITHUB_WORKSPACE"

      - name: Create or update release preparation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$PREPARE_BRANCH"
          git add CHANGELOG.md package.json README.md PACKAGE.md plugins/go-beast/.codex-plugin/plugin.json plugins/go-beast/.claude-plugin/plugin.json release-certificate.json scripts/safe-fs/bin/
          git commit -m "chore(release): prepare release" || {
            echo "No release changes were generated" >&2
            exit 1
          }
          git push --force origin "HEAD:$PREPARE_BRANCH"

      - name: Create or update release preparation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list --base "$RELEASE_BRANCH" --head "$PREPARE_BRANCH" --state open --json number --jq '.[0].number')"
          body="This PR was generated by the manual release-preparation workflow for v$RELEASE_VERSION. Review the calculated version and \`CHANGELOG.md\` before merging it into the permanent \`release\` branch. Required Verify/title/branch-flow contexts come from the normal pull_request workflow; if GitHub holds that run for approval because it was created with GITHUB_TOKEN, approve it in the PR before merging. Merging this PR creates or updates the promotion PR; after that PR is merged, GitHub Actions publishes the release automatically."
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore(release): prepare v$RELEASE_VERSION" --body "$body"
          else
            gh pr create --base "$RELEASE_BRANCH" --head "$PREPARE_BRANCH" --title "chore(release): prepare v$RELEASE_VERSION" --body "$body"
          fi
          pr_number="$(gh pr list --base "$RELEASE_BRANCH" --head "$PREPARE_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$pr_number" ]; then
            echo "Could not resolve the release preparation PR after creation/update." >&2
            exit 1
          fi
          pr_url="$(gh pr view "$pr_number" --json url --jq '.url')"
          {
            echo "## Release-preparation PR"
            echo "Created or updated: $pr_url"
            echo "Merge only after the normal pull_request Verify/title/branch-flow contexts pass. Approve any pending workflow run in GitHub; this workflow's success does not satisfy those required checks."
          } >> "$GITHUB_STEP_SUMMARY"
